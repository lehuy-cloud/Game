name: LittleLearner
options:
  bundleIdPrefix: com.antonlehuy
  deploymentTarget:
    iOS: "17.0"
targets:
  LittleLearner:
    type: application
    platform: iOS
    sources:
      - path: Sources/LittleLearner
    info:
      path: Generated-Info.plist
      properties:
        UIAppFonts:
          - Caprasimo-Regular.ttf
          - Figtree-Regular.ttf
          - Figtree-SemiBold.ttf
          - Figtree-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonlehuy.littlelearner
        PRODUCT_NAME: LittleLearner
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
